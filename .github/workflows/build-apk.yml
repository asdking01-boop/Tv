name: Build KRAS TV APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Create App Code and Generate Android Project
        run: |
          mkdir -p www
          cat << 'EOF' > www/index.html
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>KRAS TV</title>
            <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
            <style>
              :root { --red: #E50914; --bg: #141414; --card: #1f1f1f; --text: #ffffff; }
              * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
              body { background: var(--bg); color: var(--text); overflow-x: hidden; }
              #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: radial-gradient(circle, #2b0000 0%, #000000 100%); }
              .logo-box { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
              .k-icon { width: 50px; height: 50px; background: #000; border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: var(--red); border-radius: 10px; }
              .app-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; color: var(--red); }
              .login-card { background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid #333; }
              .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; }
              .btn { width: 100%; padding: 14px; background: var(--red); border: none; color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
              .error-msg { color: #ff4d4d; font-size: 13px; margin-top: 10px; text-align: center; }
              #app-screen { display: none; padding-bottom: 75px; }
              header { position: sticky; top: 0; z-index: 50; background: rgba(20,20,20,0.95); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
              .header-left { display: flex; align-items: center; gap: 10px; }
              .icon-btn { background: #2a2a2a; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
              .filter-bar { padding: 12px 16px; display: flex; gap: 10px; background: #181818; }
              select, .search-inp { flex: 1; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a; border-radius: 6px; font-size: 14px; }
              .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 12px; padding: 16px; }
              .card { background: var(--card); border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; border: 1px solid #2a2a2a; }
              .card img { width: 100%; height: 175px; object-fit: cover; background: #0d0d0d; }
              .card-title { padding: 8px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
              .badge-q { position: absolute; top: 6px; left: 6px; background: var(--red); color: #fff; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; }
              .fav-btn { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.7); color: #fff; border: none; border-radius: 50%; width: 28px; height: 28px; font-size: 15px; cursor: pointer; }
              .fav-btn.active { color: gold; }
              nav { position: fixed; bottom: 0; width: 100%; background: #0d0d0d; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #2a2a2a; z-index: 50; }
              .nav-item { color: #888; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; }
              .nav-item.active { color: var(--red); font-weight: bold; }
              .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; }
              .modal-header { padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; background: #111; }
              video { width: 100%; max-height: 80vh; background: #000; margin: auto; }
              .episodes-list { padding: 16px; overflow-y: auto; flex: 1; }
              .ep-item { padding: 12px; background: #222; margin-bottom: 8px; border-radius: 6px; display: flex; justify-content: space-between; cursor: pointer; }
            </style>
          </head>
          <body>
            <div id="login-screen">
              <div class="logo-box"><div class="k-icon">K</div><div class="app-title">KRAS TV</div></div>
              <div class="login-card">
                <input type="text" id="srv" placeholder="Server URL (http://example.com:8080)">
                <input type="text" id="usr" placeholder="Username">
                <input type="password" id="pwd" placeholder="Password">
                <button class="btn" onclick="login()">تسجيل الدخول</button>
                <div class="error-msg" id="err-msg"></div>
              </div>
            </div>
            <div id="app-screen">
              <header>
                <div class="header-left"><div class="k-icon" style="width:34px;height:34px;font-size:20px;">K</div><strong style="color:var(--red);font-size:18px;">KRAS TV</strong></div>
                <div style="display:flex;gap:8px;">
                  <button class="icon-btn" onclick="refreshAll()">🔄 تحديث</button>
                  <button class="icon-btn" onclick="logout()">خروج</button>
                </div>
              </header>
              <div class="filter-bar">
                <select id="cat-select" onchange="renderGrid()"></select>
                <input type="text" class="search-inp" id="search-inp" placeholder="بحث..." oninput="renderGrid()">
              </div>
              <div class="grid" id="content-grid"></div>
              <nav>
                <button class="nav-item active" onclick="switchTab('live', this)">📺<span>بث مباشر</span></button>
                <button class="nav-item" onclick="switchTab('movies', this)">🎬<span>أفلام</span></button>
                <button class="nav-item" onclick="switchTab('series', this)">📂<span>مسلسلات</span></button>
                <button class="nav-item" onclick="switchTab('fav', this)">⭐<span>المفضلة</span></button>
              </nav>
            </div>
            <div class="modal" id="player-modal">
              <div class="modal-header"><span id="player-title">تشغيل</span><button class="icon-btn" onclick="closePlayer()">✖ إغلاق</button></div>
              <video id="video-player" controls playsinline></video>
            </div>
            <div class="modal" id="series-modal">
              <div class="modal-header"><span id="series-title">حلقات المسلسل</span><button class="icon-btn" onclick="document.getElementById('series-modal').style.display='none'">✖ رجوع</button></div>
              <div class="episodes-list" id="episodes-list"></div>
            </div>
            <script>
              let creds = JSON.parse(localStorage.getItem('kras_creds') || 'null');
              let currentTab = 'live';
              let db = { live: { cats: [], items: [] }, movies: { cats: [], items: [] }, series: { cats: [], items: [] }, fav: JSON.parse(localStorage.getItem('kras_fav') || '[]') };
              let hls = null;
              window.onload = () => { if (creds) { showApp(); refreshAll(); } };
              function detectQuality(name) {
                if (!name) return 'HD';
                const n = name.toUpperCase();
                if (n.includes('4K') || n.includes('UHD')) return '4K';
                if (n.includes('FHD') || n.includes('1080')) return 'FHD';
                if (n.includes('SD') || n.includes('480')) return 'SD';
                return 'HD';
              }
              async function login() {
                let srv = document.getElementById('srv').value.trim().replace(/\/$/, '');
                const usr = document.getElementById('usr').value.trim();
                const pwd = document.getElementById('pwd').value.trim();
                const err = document.getElementById('err-msg');
                if (!srv || !usr || !pwd) { err.innerText = 'يرجى تعبئة جميع الحقول'; return; }
                err.innerText = 'جاري الاتصال بالسيرفر...';
                try {
                  const res = await fetch(`${srv}/player_api.php?username=${usr}&password=${pwd}`);
                  const data = await res.json();
                  if (data.user_info && data.user_info.auth == 1) {
                    creds = { srv, usr, pwd };
                    localStorage.setItem('kras_creds', JSON.stringify(creds));
                    showApp(); refreshAll();
                  } else { err.innerText = 'بيانات الدخول غير صحيحة'; }
                } catch (e) { err.innerText = 'فشل الاتصال بالسيرفر'; }
              }
              function logout() { localStorage.removeItem('kras_creds'); location.reload(); }
              function showApp() { document.getElementById('login-screen').style.display = 'none'; document.getElementById('app-screen').style.display = 'block'; }
              async function apiCall(action) {
                const r = await fetch(`${creds.srv}/player_api.php?username=${creds.usr}&password=${creds.pwd}&action=${action}`);
                return await r.json();
              }
              async function refreshAll() {
                document.getElementById('content-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;">جاري التحميل...</p>';
                try {
                  const [lCats, lItems, mCats, mItems, sCats, sItems] = await Promise.all([
                    apiCall('get_live_categories'), apiCall('get_live_streams'),
                    apiCall('get_vod_categories'), apiCall('get_vod_streams'),
                    apiCall('get_series_categories'), apiCall('get_series')
                  ]);
                  db.live = { cats: lCats || [], items: lItems || [] };
                  db.movies = { cats: mCats || [], items: mItems || [] };
                  db.series = { cats: sCats || [], items: sItems || [] };
                  populateCategories(); renderGrid();
                } catch (e) { document.getElementById('content-grid').innerHTML = '<p style="grid-column:1/-1;text-align:center;color:red;">خطأ في جلب البيانات</p>'; }
              }
              function switchTab(tab, btn) {
                currentTab = tab;
                document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById('search-inp').value = '';
                populateCategories(); renderGrid();
              }
              function populateCategories() {
                const sel = document.getElementById('cat-select');
                sel.innerHTML = '<option value="all">جميع الأقسام</option>';
                if (currentTab === 'fav') { sel.style.display = 'none'; return; }
                sel.style.display = 'block';
                (db[currentTab].cats || []).forEach(c => { sel.innerHTML += `<option value="${c.category_id}">${c.category_name}</option>`; });
              }
              function renderGrid() {
                const grid = document.getElementById('content-grid');
                const cat = document.getElementById('cat-select').value;
                const q = document.getElementById('search-inp').value.toLowerCase();
                let list = currentTab === 'fav' ? db.fav : (db[currentTab].items || []);
                if (currentTab !== 'fav' && cat !== 'all') list = list.filter(i => i.category_id == cat);
                if
