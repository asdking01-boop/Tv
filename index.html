<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KRAS TV</title>

  <style>
    :root { --red: #E50914; --bg: #141414; --card: #1f1f1f; --text: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: var(--bg); color: var(--text); overflow-x: hidden; }
    
    /* Login Screen */
    #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 20px; background: radial-gradient(circle, #2b0000 0%, #000000 100%); }
    .logo-box { display: flex; align-items: center; gap: 10px; margin-bottom: 30px; }
    .k-icon { width: 50px; height: 50px; background: #000; border: 2px solid var(--red); display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 900; color: var(--red); border-radius: 10px; }
    .app-title { font-size: 32px; font-weight: 900; letter-spacing: 2px; color: var(--red); }
    .login-card { background: rgba(0,0,0,0.85); padding: 25px; border-radius: 12px; width: 100%; max-width: 380px; border: 1px solid #333; }
    .login-card input { width: 100%; padding: 14px; margin-bottom: 15px; background: #333; border: 1px solid #444; color: #fff; border-radius: 6px; font-size: 15px; }
    .btn { width: 100%; padding: 14px; background: var(--red); border: none; color: #fff; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    .error-msg { color: #ff4d4d; font-size: 13px; margin-top: 10px; text-align: center; }

    /* Main App */
    #app-screen { display: none; padding-bottom: 75px; }
    header { position: sticky; top: 0; z-index: 50; background: rgba(20,20,20,0.95); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .icon-btn { background: #2a2a2a; border: none; color: #fff; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
